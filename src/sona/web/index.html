<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Sona</title>
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/app.js" type="module"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#upload" aria-label="Sona 首页">Sona</a>
        <nav class="navigation" aria-label="音频功能">
          <button class="nav-item is-active" type="button" data-view="upload" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></svg>
            <span>选择音频</span>
          </button>
          <button class="nav-item" type="button" data-view="library">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H18a1 1 0 0 1 1 1v14.5A2.5 2.5 0 0 0 16.5 16H7.5A2.5 2.5 0 0 0 5 18.5v-13Z" /><path d="M8.5 7.5h7M8.5 11h5" /></svg>
            <span>我的音频</span>
          </button>
          <button class="nav-item" type="button" data-view="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8m4 0h4M4 17h3m4 0h9M12 4v6m-5 4v6" /></svg>
            <span>设置</span>
          </button>
        </nav>
      </aside>
      <main class="content">
        <section class="view" data-panel="upload" aria-label="选择音频">
          <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.aif,.aiff,.wma" hidden />
          <button class="drop-zone" type="button" id="drop-zone" data-upload-trigger aria-describedby="audio-formats">
            <span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" /></svg></span>
            <strong>选择音频文件</strong>
            <span>或将文件拖放到这里</span>
            <small id="audio-formats">可选择 MP3、WAV、M4A 等音频文件，一次一个</small>
          </button>
          <div class="import-progress" id="import-progress" hidden>
            <p class="import-status" id="import-status" aria-live="polite"></p>
            <button class="secondary-button" id="cancel-import" type="button">取消导入</button>
          </div>
        </section>
        <section class="view" data-panel="library" aria-label="我的音频" hidden>
          <div class="audio-table-wrap" id="audio-table-region">
            <table class="audio-table" aria-label="历史音频">
              <thead><tr><th scope="col">文件名</th><th scope="col">大小</th><th scope="col">导入时间</th><th scope="col">状态</th><th scope="col" class="audio-operations">操作</th></tr></thead>
              <tbody id="audio-list"><tr><td colspan="5" class="audio-empty">正在读取…</td></tr></tbody>
            </table>
          </div>
          <article id="transcript" class="transcript" aria-labelledby="transcript-title" hidden>
            <div class="transcript-toolbar">
              <button type="button" class="secondary-button" id="transcript-back">返回列表</button>
              <div class="transcript-actions">
                <button type="button" class="secondary-button" id="transcript-open">打开音频</button>
                <button type="button" class="secondary-button" id="transcript-copy">复制全文</button>
              </div>
            </div>
            <h2 id="transcript-title" tabindex="-1"></h2>
            <div id="transcript-content" class="transcript-content"></div>
          </article>
          <div class="audio-feedback" id="audio-feedback" hidden>
            <p id="audio-feedback-message" role="status"></p>
            <button class="secondary-button" type="button" id="audio-retry">重新加载</button>
          </div>
        </section>
        <section class="view settings-view" data-panel="settings" aria-labelledby="settings-title" hidden>
          <h1 class="sr-only" id="settings-title">设置</h1>
          <div class="settings-groups">
            <section class="settings-group" aria-labelledby="acceleration-title">
              <div class="group-heading"><h2 id="acceleration-title">转录加速</h2></div>
              <div class="acceleration-row">
                <div class="acceleration-info">
                  <p id="acceleration-status" role="status">正在检查…</p>
                  <small id="acceleration-detail" hidden></small>
                </div>
                <button class="secondary-button" id="acceleration-action" type="button" hidden></button>
              </div>
              <div class="speech-download-progress" id="acceleration-progress-region" hidden>
                <progress id="acceleration-progress" max="1" aria-label="加速组件下载进度"></progress>
                <div class="speech-progress-meta"><span id="acceleration-progress-label"></span></div>
              </div>
              <div class="models-feedback" id="acceleration-feedback" hidden>
                <p id="acceleration-feedback-message" role="status"></p>
                <button class="secondary-button" id="acceleration-reconnect" type="button">重新加载</button>
              </div>
            </section>
            <section class="settings-group" aria-labelledby="speech-model-title">
              <div class="group-heading">
                <h2 id="speech-model-title">音频转文字模型</h2>
              </div>
              <div id="speech-models">
                <p class="models-loading" role="status">正在读取模型列表…</p>
              </div>
              <div class="models-feedback" id="models-feedback" hidden>
                <p id="models-feedback-message" role="status"></p>
                <button class="secondary-button" id="models-reconnect" type="button">重新连接</button>
              </div>
            </section>
            <section class="settings-group" aria-labelledby="ai-model-title">
              <div class="group-heading">
                <h2 id="ai-model-title">AI 模型</h2>
                <button class="secondary-button" type="button" disabled aria-describedby="ai-model-note">新增模型</button>
              </div>
              <div class="models-empty">
                <span id="ai-model-note">AI 模型配置暂未开放</span>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>
    <div class="toast-region" id="toast-region" role="region" aria-label="操作提示"></div>
    <dialog class="app-dialog confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
      <form method="dialog">
        <h2 id="confirm-dialog-title"></h2>
        <p class="dialog-message" id="confirm-dialog-message"></p>
        <div class="dialog-actions">
          <button class="secondary-button" type="submit" value="cancel" autofocus>取消</button>
          <button class="dialog-confirm-button" id="confirm-dialog-accept" type="submit" value="confirm">确认</button>
        </div>
      </form>
    </dialog>
    <dialog class="app-dialog task-detail-dialog" id="task-detail-dialog" aria-labelledby="task-detail-title">
      <div class="dialog-heading">
        <h2 id="task-detail-title">任务详情</h2>
        <form method="dialog"><button class="secondary-button" type="submit" autofocus>关闭</button></form>
      </div>
      <p class="task-detail-name" id="task-detail-name"></p>
      <p class="task-detail-content" id="task-detail-content"></p>
    </dialog>
    <template id="speech-model-template">
      <article class="model-option">
        <div class="model-info">
          <div class="model-option-content">
            <div class="model-heading">
              <strong data-model-name></strong>
              <span class="model-badge" data-model-status role="status"></span>
            </div>
            <small data-model-description></small>
            <small data-model-detail></small>
            <small data-model-size hidden></small>
          </div>
        </div>
        <div class="model-actions">
          <button class="secondary-button model-action" data-model-action type="button"></button>
          <button class="secondary-button" data-model-pause type="button" hidden>暂停下载</button>
          <button class="secondary-button model-delete" data-model-delete type="button" aria-haspopup="dialog" hidden>删除</button>
        </div>
        <div class="speech-download-progress" data-model-progress-region hidden>
          <progress data-model-progress max="1" aria-label="模型下载进度"></progress>
          <div class="speech-progress-meta">
            <span data-model-progress-value></span>
            <span data-model-elapsed></span>
          </div>
        </div>
        <details class="speech-error" data-model-error hidden>
          <summary>错误详情</summary>
          <pre data-model-error-detail></pre>
        </details>
      </article>
    </template>
  </body>
</html>
