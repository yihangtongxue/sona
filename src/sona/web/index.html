<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Sona</title>
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#upload" aria-label="Sona 首页">Sona</a>
        <nav class="navigation" aria-label="音频功能">
          <button class="nav-item is-active" type="button" data-view="upload" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></svg>
            <span>上传音频</span>
          </button>
          <button class="nav-item" type="button" data-view="library">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H18a1 1 0 0 1 1 1v14.5A2.5 2.5 0 0 0 16.5 16H7.5A2.5 2.5 0 0 0 5 18.5v-13Z" /><path d="M8.5 7.5h7M8.5 11h5" /></svg>
            <span>我的音频</span>
          </button>
        </nav>
      </aside>
      <main class="content">
        <section class="view" data-panel="upload" aria-labelledby="upload-title">
          <header class="page-header">
            <p class="eyebrow">新建转录</p>
            <h1 id="upload-title">上传音频</h1>
            <p>选择一个音频文件，Sona 会将它整理成可阅读的内容。</p>
          </header>
          <label class="drop-zone" for="audio-file" id="drop-zone">
            <input id="audio-file" type="file" accept="audio/*" hidden />
            <span class="upload-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L7.5 7.5M12 3l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" /></svg></span>
            <strong>选择音频文件</strong>
            <span>或将文件拖放到这里</span>
            <small>支持 MP3、WAV、M4A 等常见格式</small>
          </label>
          <p class="selected-file" id="selected-file" aria-live="polite"></p>
        </section>
        <section class="view" data-panel="library" aria-labelledby="library-title" hidden>
          <header class="page-header">
            <p class="eyebrow">音频资料</p>
            <h1 id="library-title">我的音频</h1>
            <p>你上传和处理过的音频会保存在这里。</p>
          </header>
          <div class="empty-library">
            <span class="library-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H18a1 1 0 0 1 1 1v14.5A2.5 2.5 0 0 0 16.5 16H7.5A2.5 2.5 0 0 0 5 18.5v-13Z" /><path d="M8.5 7.5h7M8.5 11h5" /></svg></span>
            <h2>还没有音频</h2>
            <p>从上传一个音频开始。</p>
            <button class="primary-button" type="button" data-upload-trigger>上传音频</button>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
