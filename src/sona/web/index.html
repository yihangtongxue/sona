<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sona</title>
    <script src="js/theme-bootstrap.js"></script>
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/app.js" type="module"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#upload" aria-label="Sona 首页">Sona</a>
        <nav class="navigation" aria-label="功能导航">
          <button class="nav-item is-active" type="button" data-view="upload" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" /></svg>
            <span>导入音频</span>
          </button>
          <button class="nav-item" type="button" data-view="library">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H18a1 1 0 0 1 1 1v14.5A2.5 2.5 0 0 0 16.5 16H7.5A2.5 2.5 0 0 0 5 18.5v-13Z" /><path d="M8.5 7.5h7M8.5 11h5" /></svg>
            <span>我的音频</span>
          </button>
          <button class="nav-item" type="button" data-view="manuscripts">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8l-5-5Z" /><path d="M14 3v5h5M9 12h6M9 16h6" /></svg>
            <span>文稿</span>
          </button>
          <button class="nav-item" type="button" data-view="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8m4 0h4M4 17h3m4 0h9M12 4v6m-5 4v6" /></svg>
            <span>设置</span>
          </button>
        </nav>
      </aside>
      <main class="content">
        <section class="view import-view" data-panel="upload" aria-label="导入音频">
          <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.aif,.aiff,.wma" hidden />
          <div class="import-source-grid" id="import-sources">
            <button class="import-source-card drop-zone" type="button" id="drop-zone" data-upload-trigger aria-describedby="local-import-help">
              <span class="source-icon source-icon-local" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 14v2m4-4v6m4-4v2" /></svg></span>
              <strong class="source-name">本地文件</strong>
              <span class="source-description" id="local-import-help">选择音频文件，或拖放到这里。</span>
              <span class="source-action">选择文件<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg></span>
            </button>
          </div>
          <div class="import-progress" id="import-progress" hidden>
            <p class="import-status" id="import-status" aria-live="polite"></p>
            <button class="secondary-button" id="cancel-import" type="button">取消导入</button>
          </div>
        </section>
        <section class="view" data-panel="library" aria-label="我的音频" hidden>
          <div class="audio-table-wrap" id="audio-table-region" role="region" aria-label="音频列表" tabindex="0">
            <table class="audio-table" aria-label="历史音频">
              <thead><tr><th scope="col">名称</th><th scope="col" class="audio-size">大小</th><th scope="col">导入时间</th><th scope="col">状态</th><th scope="col" class="audio-operations">操作</th></tr></thead>
              <tbody id="audio-list"><tr><td colspan="5" class="audio-empty">正在读取…</td></tr></tbody>
            </table>
          </div>
          <article id="transcript" class="transcript" aria-labelledby="transcript-title" hidden>
            <div class="transcript-toolbar">
              <button type="button" class="secondary-button" id="transcript-back">返回列表</button>
              <div class="transcript-actions">
                <button type="button" class="secondary-button" id="transcript-copy">复制全文</button>
                <button type="button" class="secondary-button" id="transcript-optimize" title="使用默认 AI 模型整理；正文会发送到该模型的接口，可能产生费用">优化转录</button>
              </div>
            </div>
            <h2 id="transcript-title" tabindex="-1"></h2>
            <div id="transcript-content" class="transcript-content"></div>
          </article>
          <div class="audio-feedback" id="audio-feedback" hidden>
            <p id="audio-feedback-message" role="status"></p>
            <button class="secondary-button" type="button" id="audio-retry">重新加载</button>
          </div>
        </section>
        <section class="view" data-panel="manuscripts" aria-label="文稿" hidden>
          <div class="audio-table-wrap" id="manuscript-table-region" role="region" aria-label="文稿列表" tabindex="0">
            <table class="audio-table manuscript-table" aria-label="文稿列表">
              <thead><tr><th scope="col">标题</th><th scope="col">创建时间</th><th scope="col">状态</th><th scope="col" class="audio-operations">操作</th></tr></thead>
              <tbody id="manuscript-list"><tr><td colspan="4" class="audio-empty">正在读取…</td></tr></tbody>
            </table>
          </div>
          <article id="manuscript" class="transcript" aria-labelledby="manuscript-title" hidden>
            <div class="transcript-toolbar">
              <button type="button" class="secondary-button" id="manuscript-back">返回列表</button>
              <button type="button" class="secondary-button" id="manuscript-copy">复制全文</button>
            </div>
            <div class="manuscript-reading">
              <h2 id="manuscript-title" tabindex="-1"></h2>
              <div id="manuscript-content" class="manuscript-content"></div>
            </div>
          </article>
          <div class="audio-feedback" id="manuscript-feedback" hidden>
            <p id="manuscript-feedback-message" role="status"></p>
            <button class="secondary-button" type="button" id="manuscript-reload">重新加载</button>
          </div>
        </section>
        <section class="view settings-view" data-panel="settings" aria-labelledby="settings-title" hidden>
          <h1 class="sr-only" id="settings-title">设置</h1>
          <div class="settings-groups">
            <section class="settings-group" aria-labelledby="appearance-title">
              <div class="group-heading"><h2 id="appearance-title">外观</h2></div>
              <div class="appearance-row">
                <div class="appearance-info">
                  <label for="appearance-theme">主题模式</label>
                  <p id="appearance-description">跟随系统自动切换，也可以固定使用浅色或深色。</p>
                </div>
                <select id="appearance-theme" aria-describedby="appearance-description" disabled>
                  <option value="system">跟随系统</option>
                  <option value="light">浅色</option>
                  <option value="dark">深色</option>
                </select>
              </div>
              <p class="appearance-feedback" id="appearance-feedback" role="status" hidden></p>
              <button class="secondary-button" id="appearance-retry" type="button" hidden>重新加载</button>
            </section>
            <section class="settings-group" aria-labelledby="acceleration-title">
              <div class="group-heading"><h2 id="acceleration-title">转录加速</h2></div>
              <div class="acceleration-row">
                <div class="acceleration-info">
                  <p id="acceleration-status" role="status">正在检查…</p>
                  <small id="acceleration-detail" hidden></small>
                </div>
                <button class="secondary-button" id="acceleration-action" type="button" hidden></button>
              </div>
              <div class="speech-download-progress" id="acceleration-progress-region" hidden>
                <progress id="acceleration-progress" max="1" aria-label="加速组件下载进度"></progress>
                <div class="speech-progress-meta"><span id="acceleration-progress-label"></span></div>
              </div>
              <div class="models-feedback" id="acceleration-feedback" hidden>
                <p id="acceleration-feedback-message" role="status"></p>
                <button class="secondary-button" id="acceleration-reconnect" type="button">重新加载</button>
              </div>
            </section>
            <section class="settings-group" aria-labelledby="speech-model-title">
              <div class="group-heading">
                <h2 id="speech-model-title">音频转文字模型</h2>
              </div>
              <div id="speech-models">
                <p class="models-loading" role="status">正在读取模型列表…</p>
              </div>
              <div class="models-feedback" id="models-feedback" hidden>
                <p id="models-feedback-message" role="status"></p>
                <button class="secondary-button" id="models-reconnect" type="button">重新连接</button>
              </div>
            </section>
            <section class="settings-group" aria-labelledby="ai-model-title">
              <div class="group-heading">
                <h2 id="ai-model-title">AI 模型</h2>
                <button class="secondary-button" id="add-ai-model" type="button">新增模型</button>
              </div>
              <div id="ai-models">
                <p class="models-loading" role="status">正在读取 AI 模型列表…</p>
              </div>
              <div class="models-feedback" id="ai-model-feedback" hidden>
                <p id="ai-model-feedback-message" role="status"></p>
                <button class="secondary-button" id="ai-model-reconnect" type="button">重新加载</button>
              </div>
            </section>
            <section class="settings-group" aria-labelledby="about-title">
              <div class="group-heading"><h2 id="about-title">关于</h2></div>
              <div class="about-row">
                <div class="about-info">
                  <strong>Sona <span id="app-version"></span></strong>
                  <p class="about-description">把声音整理成文字，让内容更易读。</p>
                </div>
                <div class="about-actions">
                  <button class="secondary-button" id="check-update" type="button">检查更新</button>
                  <button class="secondary-button" id="download-update" type="button" hidden>下载更新</button>
                  <button class="secondary-button" id="install-update" type="button" hidden>重启更新</button>
                  <button class="secondary-button" id="cancel-update" type="button" hidden>取消下载</button>
                </div>
                <p class="update-message" id="update-message" role="status" hidden></p>
              </div>
              <progress id="update-progress" max="1" aria-label="更新下载进度" hidden></progress>
              <details class="update-notes" id="update-notes" hidden>
                <summary>更新说明</summary>
                <p id="update-notes-content"></p>
              </details>
              <div class="about-contact" aria-label="作者与联系方式">
                <span>作者：一航同学YIHANG</span>
                <a href="https://maxcosmos.top" target="_blank" rel="noopener noreferrer" aria-label="访问作者主页 maxcosmos.top">maxcosmos.top</a>
                <a href="mailto:leo.morrison.2001@gmail.com" target="_blank" rel="noopener noreferrer" aria-label="联系作者 leo.morrison.2001@gmail.com">leo.morrison.2001@gmail.com</a>
                <button type="button" class="diagnostics-button" id="export-diagnostics" title="保存本地诊断日志，不包含正文和密钥，不会自动上传">导出日志</button>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>
    <div class="toast-region" id="toast-region" role="region" aria-label="操作提示"></div>
    <template id="podcast-source-template">
      <button class="import-source-card" type="button" aria-haspopup="dialog" aria-controls="podcast-dialog">
        <span class="source-icon" data-source-icon aria-hidden="true"></span>
        <strong class="source-name" data-source-name></strong>
        <span class="source-description" data-source-description></span>
        <span class="source-action">粘贴链接<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" /></svg></span>
      </button>
    </template>
    <dialog class="app-dialog podcast-dialog" id="podcast-dialog" aria-labelledby="podcast-title" aria-describedby="podcast-help">
      <div class="dialog-heading">
        <div class="podcast-dialog-heading">
          <span class="source-icon" id="podcast-dialog-icon" aria-hidden="true"></span>
          <h2 id="podcast-title"></h2>
        </div>
        <button class="podcast-dialog-close" id="podcast-close" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <p class="podcast-help" id="podcast-help"></p>
      <form class="podcast-import" id="podcast-form">
        <label for="podcast-url">播客链接</label>
        <input id="podcast-url" type="url" required maxlength="4096" autocomplete="off" autofocus
               spellcheck="false" placeholder="粘贴播客链接" aria-describedby="podcast-help podcast-error" />
        <p id="podcast-error" class="podcast-error" role="alert" hidden></p>
        <p class="podcast-next-step">完成后，在「我的音频」查看文字。</p>
        <div class="dialog-actions">
          <button class="secondary-button" id="podcast-cancel" type="button">取消</button>
          <button class="dialog-confirm-button" id="podcast-submit" type="submit">获取并转录</button>
        </div>
      </form>
    </dialog>
    <dialog class="app-dialog confirm-dialog" id="confirm-dialog" aria-labelledby="confirm-dialog-title" aria-describedby="confirm-dialog-message">
      <form method="dialog">
        <h2 id="confirm-dialog-title"></h2>
        <p class="dialog-message" id="confirm-dialog-message"></p>
        <div class="dialog-actions">
          <button class="secondary-button" type="submit" value="cancel" autofocus>取消</button>
          <button class="dialog-confirm-button" id="confirm-dialog-accept" type="submit" value="confirm">确认</button>
        </div>
      </form>
    </dialog>
    <dialog class="app-dialog task-detail-dialog" id="task-detail-dialog" aria-labelledby="task-detail-title">
      <div class="dialog-heading">
        <h2 id="task-detail-title">任务详情</h2>
        <form method="dialog"><button class="secondary-button" type="submit" autofocus>关闭</button></form>
      </div>
      <p class="task-detail-name" id="task-detail-name"></p>
      <p class="task-detail-content" id="task-detail-content"></p>
    </dialog>
    <dialog class="app-dialog ai-model-dialog" id="ai-model-dialog" aria-labelledby="ai-model-dialog-title">
      <form id="ai-model-form">
        <div class="dialog-heading ai-model-dialog-heading">
          <h2 id="ai-model-dialog-title" tabindex="-1" autofocus>新增模型</h2>
        </div>
        <div class="ai-model-form-fields">
          <div class="ai-model-form-section">
            <div class="ai-model-field">
              <span id="ai-provider-label">供应商</span>
              <div class="ai-provider-select" id="ai-provider-select">
                <button class="ai-provider-trigger" id="ai-provider-trigger" type="button" role="combobox" aria-labelledby="ai-provider-label" aria-haspopup="listbox" aria-controls="ai-provider-options" aria-expanded="false">
                  <span id="ai-provider-value">OpenAI</span>
                  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 8 4 4 4-4" /></svg>
                </button>
                <div class="ai-provider-options" id="ai-provider-options" role="listbox" aria-labelledby="ai-provider-label" hidden>
                  <button class="ai-provider-option is-selected" id="ai-provider-openai" data-provider-option="openai" type="button" role="option" aria-selected="true" tabindex="-1">OpenAI</button>
                  <button class="ai-provider-option" id="ai-provider-anthropic" data-provider-option="anthropic" type="button" role="option" aria-selected="false" tabindex="-1">Claude</button>
                  <button class="ai-provider-option" id="ai-provider-google" data-provider-option="google" type="button" role="option" aria-selected="false" tabindex="-1">Google Gemini</button>
                  <button class="ai-provider-option" id="ai-provider-zhipu" data-provider-option="zhipu" type="button" role="option" aria-selected="false" tabindex="-1">智谱 GLM</button>
                  <button class="ai-provider-option" id="ai-provider-zhipu-coding" data-provider-option="zhipu-coding" type="button" role="option" aria-selected="false" tabindex="-1">智谱 Coding Plan</button>
                  <button class="ai-provider-option" id="ai-provider-openai-compatible" data-provider-option="openai-compatible" type="button" role="option" aria-selected="false" tabindex="-1">自定义接口</button>
                </div>
              </div>
              <input name="provider" type="hidden" value="openai" />
            </div>
          </div>
          <div class="ai-model-form-section">
            <label class="ai-model-field">
              <span>模型标识</span>
              <input name="model_name" type="text" maxlength="255" required autocomplete="off" spellcheck="false" placeholder="输入模型 ID" />
            </label>
            <label class="ai-model-field" id="ai-model-url-field" hidden>
              <span>API 地址</span>
              <input name="base_url" type="url" maxlength="2048" disabled autocomplete="off" spellcheck="false" placeholder="https://example.com/v1" />
            </label>
            <button class="ai-model-text-button" id="ai-model-reset-url" type="button" hidden>恢复官方地址</button>
            <div class="ai-model-field">
              <span><label for="ai-model-api-key">API Key</label></span>
              <div class="ai-model-key-input">
                <input id="ai-model-api-key" name="api_key" type="password" maxlength="4096" required autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="输入 API Key" />
                <button class="ai-model-key-toggle" id="ai-model-key-toggle" type="button" aria-label="显示 API Key" title="显示 API Key" aria-controls="ai-model-api-key" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path id="ai-model-key-slash" d="m3 3 18 18" hidden/></svg>
                </button>
              </div>
            </div>
            <label class="ai-model-field">
              <span>模型名称 <small>可选</small></span>
              <input name="name" type="text" maxlength="100" placeholder="默认使用模型标识" />
            </label>
            <p class="ai-model-form-error" id="ai-model-last-error" role="status" hidden></p>
            <p class="ai-model-form-error" id="ai-model-form-error" role="alert" hidden></p>
          </div>
        </div>
        <div class="dialog-actions">
          <button class="secondary-button" id="ai-model-dialog-cancel" type="button">取消</button>
          <button class="dialog-confirm-button" type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <template id="speech-model-template">
      <article class="model-option">
        <div class="model-info">
          <div class="model-option-content">
            <div class="model-heading">
              <strong data-model-name></strong>
              <span class="model-badge" data-model-status role="status"></span>
            </div>
            <small data-model-description></small>
            <small data-model-detail></small>
            <small data-model-size hidden></small>
          </div>
        </div>
        <div class="model-actions">
          <button class="secondary-button model-action" data-model-action type="button"></button>
          <button class="secondary-button" data-model-pause type="button" hidden>暂停下载</button>
          <button class="secondary-button model-delete" data-model-delete type="button" aria-haspopup="dialog" hidden>删除</button>
        </div>
        <div class="speech-download-progress" data-model-progress-region hidden>
          <progress data-model-progress max="1" aria-label="模型下载进度"></progress>
          <div class="speech-progress-meta">
            <span data-model-progress-value></span>
            <span data-model-elapsed></span>
          </div>
        </div>
        <details class="speech-error" data-model-error hidden>
          <summary>错误详情</summary>
          <pre data-model-error-detail></pre>
        </details>
      </article>
    </template>
    <template id="ai-model-template">
      <article class="model-option ai-model-option">
        <div class="model-info">
          <div class="model-option-content">
            <div class="model-heading">
              <strong data-ai-model-name></strong>
              <span class="model-badge" data-ai-model-status role="status"></span>
            </div>
          </div>
        </div>
        <div class="model-actions">
          <button class="secondary-button" data-ai-model-test type="button">测试连接</button>
          <button class="secondary-button" data-ai-model-select type="button">设为默认</button>
          <button class="secondary-button" data-ai-model-edit type="button">编辑</button>
          <button class="secondary-button" data-ai-model-view type="button" aria-haspopup="dialog" hidden>查看详细</button>
          <button class="secondary-button model-delete" data-ai-model-delete type="button" aria-haspopup="dialog">删除</button>
        </div>
        <details class="speech-error" data-ai-model-error hidden>
          <summary>错误详情</summary>
          <pre data-ai-model-error-detail></pre>
        </details>
      </article>
    </template>
  </body>
</html>
