[project]
name = "sona"
version = "1.1.0"
description = "Local audio transcription with faster-whisper and MLX Whisper"
readme = "README.md"
authors = [
    { name = "一航同学YIHANG", email = "leo.morrison.2001@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pywebview>=6.2.1",
    "av>=14,<17",
    "numpy>=2.1,<3",
    "keyring>=25,<27",
    "cryptography>=46,<51",
    "certifi>=2026.7.22",
    "litellm>=1,<2",
    "yt-dlp==2026.8.19",
    "faster-whisper>=1.2.1,<2; sys_platform != 'darwin'",
    "mlx-whisper>=0.4.3,<0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Homepage = "https://maxcosmos.top"

[project.scripts]
sona = "sona:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
